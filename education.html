<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education - Pranesh Mithun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .cursor-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            transition: opacity 0.3s;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 25px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: #3b82f6;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 20px;
        }

        .nav-links {
            display: flex;
            gap: 45px;
            list-style: none;
        }

        .nav-links a {
            color: #b4b4b4;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            position: relative;
            padding: 8px 0;
            transition: all 0.3s ease;
        }

        .nav-links a.active {
            color: #fff;
        }

        .nav-links a::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: #3b82f6;
            transition: width 0.3s ease;
        }

        .nav-links a.active::before {
            width: 100%;
        }

        .nav-links a:hover {
            color: #fff;
        }

        .nav-links a:hover::before {
            width: 100%;
        }

        .background-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .education-section {
            min-height: 100vh;
            padding: 140px 60px 60px;
            position: relative;
            z-index: 2;
        }

        .section-title {
            text-align: center;
            font-size: 64px;
            font-weight: 700;
            margin-bottom: 80px;
            color: #fff;
            letter-spacing: -2px;
            animation: fadeInUp 0.8s ease-out;
        }

        .timeline {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, transparent, rgba(59, 130, 246, 0.3), transparent);
            transform: translateX(-50%);
        }

        .timeline-item {
            margin-bottom: 60px;
            position: relative;
            animation: fadeInUp 0.8s ease-out backwards;
        }

        .timeline-item:nth-child(1) {
            animation-delay: 0.2s;
        }

        .timeline-item:nth-child(2) {
            animation-delay: 0.4s;
        }

        .timeline-item:nth-child(odd) .timeline-content {
            margin-left: 0;
            margin-right: auto;
            padding-right: 60px;
        }

        .timeline-item:nth-child(even) .timeline-content {
            margin-left: auto;
            margin-right: 0;
            padding-left: 60px;
        }

        .timeline-content {
            width: 45%;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 35px;
            position: relative;
            transition: all 0.3s ease;
        }

        .timeline-content:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(59, 130, 246, 0.3);
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.15);
        }

        .timeline-dot {
            position: absolute;
            left: 50%;
            top: 30px;
            width: 16px;
            height: 16px;
            background: #3b82f6;
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 0 6px rgba(59, 130, 246, 0.2),
                        0 0 20px rgba(59, 130, 246, 0.4);
            z-index: 2;
        }

        .timeline-badge {
            display: inline-block;
            background: #1e293b;
            color: #fff;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .timeline-badge.present {
            background: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        .degree {
            font-size: 28px;
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .institution {
            font-size: 18px;
            color: #e5e5e5;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .cgpa {
            font-size: 15px;
            color: #9ca3af;
            font-style: italic;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cgpa strong {
            color: #3b82f6;
            font-weight: 600;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: particleFloat 20s infinite;
        }

        footer {
            text-align: center;
            padding: 30px;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #9ca3af;
            font-size: 14px;
            position: relative;
            z-index: 2;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .education-section {
                padding: 120px 30px 40px;
            }

            .section-title {
                font-size: 48px;
                margin-bottom: 60px;
            }

            .timeline::before {
                left: 20px;
            }

            .timeline-dot {
                left: 20px;
            }

            .timeline-item:nth-child(odd) .timeline-content,
            .timeline-item:nth-child(even) .timeline-content {
                width: calc(100% - 60px);
                margin-left: 60px;
                padding: 25px;
            }

            nav {
                padding: 20px 30px;
                flex-direction: column;
                gap: 20px;
            }

            .nav-links {
                gap: 20px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .degree {
                font-size: 24px;
            }

            .institution {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="background-grid"></div>
    <div class="cursor-glow" id="cursorGlow"></div>
    <div class="particles" id="particles"></div>

    <nav>
        <div class="logo">
            <div class="logo-icon">PM</div>
            Pranesh Mithun 
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="education.html" class="active">Education</a></li>
            <li><a href="about page.html">About</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#resume">Resume</a></li>
            <li><a href="connect.html">Connect</a></li>
        </ul>
    </nav>

    <section class="education-section">
        <h1 class="section-title">Education</h1>

        <div class="timeline">
            <div class="timeline-item">
                <div class="timeline-dot"></div>
                <div class="timeline-content">
                    <span class="timeline-badge present">PRESENT</span>
                    <h3 class="degree">BE Computer Science</h3>
                    <p class="institution">Sathyabama University, Chennai</p>
                    <p class="cgpa">1st Year • CGPA: <strong>8.59</strong></p>
                </div>
            </div>

            <div class="timeline-item">
                <div class="timeline-dot"></div>
                <div class="timeline-content">
                    <span class="timeline-badge">May 2025</span>
                    <h3 class="degree">XII Grade</h3>
                    <p class="institution">United Public School, Coimbatore</p>
                    <p class="cgpa">CGPA: <strong>7.6</strong></p>
                </div>
            </div>
        </div>
    </section>

    <footer>
        © Copyright 2026 Pranesh Mithun G S
    </footer>

    <script>
        const cursorGlow = document.getElementById('cursorGlow');
        
        document.addEventListener('mousemove', (e) => {
            cursorGlow.style.left = e.clientX + 'px';
            cursorGlow.style.top = e.clientY + 'px';
        });

        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 40; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 20 + 's';
            particle.style.animationDuration = (Math.random() * 15 + 15) + 's';
            particlesContainer.appendChild(particle);
        }

        const timelineItems = document.querySelectorAll('.timeline-content');
        
        const observerOptions = {
            threshold: 0.2,
            rootMargin: '0px 0px -100px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        timelineItems.forEach(item => {
            observer.observe(item);
        });
    </script>
</body>
</html>
